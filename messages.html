<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Messages · VELMORA</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f7f7f2;
    color:#17231c;
    font-family:Arial,sans-serif;
}
header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 6%;
    border-bottom:1px solid #dfe5df;
    background:#fff;
}
.logo{
    font-family:Georgia,serif;
    font-size:24px;
    font-weight:bold;
    color:#177245;
}
nav a{
    margin-left:22px;
    color:#435047;
    text-decoration:none;
    font-size:14px;
}
main{
    max-width:1100px;
    margin:50px auto;
    padding:0 22px;
}
.hero h1{
    font-family:Georgia,serif;
    font-size:clamp(38px,6vw,68px);
    margin:0 0 12px;
    letter-spacing:-2px;
}
.hero p{
    max-width:650px;
    color:#657169;
    line-height:1.7;
}
.messages-layout{
    margin-top:40px;
    display:grid;
    grid-template-columns:330px 1fr;
    min-height:560px;
    background:#fff;
    border:1px solid #dfe5df;
    border-radius:22px;
    overflow:hidden;
}
.conversations{
    border-right:1px solid #dfe5df;
}
.panel-title{
    padding:22px;
    border-bottom:1px solid #e7ebe7;
    font-weight:bold;
}
.conversation{
    padding:18px 20px;
    border-bottom:1px solid #edf0ed;
    cursor:pointer;
}
.conversation:hover{
    background:#f7faf7;
}
.conversation.active{
    background:#eef7f0;
}
.conversation strong{
    display:block;
    margin-bottom:5px;
}
.conversation span{
    color:#78827b;
    font-size:13px;
}
.chat{
    display:flex;
    flex-direction:column;
}
.chat-empty{
    margin:auto;
    text-align:center;
    color:#7a837d;
    padding:30px;
}
.chat-header{
    padding:20px 24px;
    border-bottom:1px solid #e1e6e1;
    font-weight:bold;
}
.chat-messages{
    flex:1;
    padding:24px;
    overflow-y:auto;
}
.message{
    max-width:70%;
    padding:12px 15px;
    margin-bottom:12px;
    border-radius:16px;
    line-height:1.5;
    font-size:14px;
}
.message.mine{
    margin-left:auto;
    background:#177245;
    color:#fff;
    border-bottom-right-radius:5px;
}
.message.theirs{
    background:#eef1ee;
    border-bottom-left-radius:5px;
}
.message-time{
    display:block;
    margin-top:5px;
    font-size:10px;
    opacity:.65;
}
.message-form{
    display:flex;
    gap:10px;
    padding:18px;
    border-top:1px solid #e1e6e1;
}
.message-form textarea{
    flex:1;
    resize:none;
    min-height:48px;
    border:1px solid #ccd5ce;
    border-radius:14px;
    padding:14px;
    font:inherit;
}
button{
    border:0;
    border-radius:14px;
    padding:0 22px;
    background:#177245;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
.status{
    padding:18px;
    color:#737d76;
}
.error{
    color:#a33b3b;
}
@media(max-width:760px){
    nav{display:none}
    .messages-layout{
        grid-template-columns:1fr;
    }
    .conversations{
        border-right:0;
        border-bottom:1px solid #dfe5df;
        max-height:250px;
        overflow-y:auto;
    }
    .chat{
        min-height:450px;
    }
}
</style>

<style id="velmora-messages-professional">

/* =========================================================
   VELMORA GENESIS — MESSAGES
   ========================================================= */

:root {
    --msg-ink: #0b1510;
    --msg-ink-soft: #15231b;
    --msg-green: #16834f;
    --msg-green-dark: #0c6039;
    --msg-green-light: #35a66f;
    --msg-green-pale: #eaf4ee;
    --msg-cream: #f6f8f5;
    --msg-white: #ffffff;
    --msg-muted: #66736c;
    --msg-soft: #98a39d;
    --msg-line: #dce4df;
    --msg-line-soft: #edf1ee;
    --msg-shadow: 0 22px 65px rgba(11,21,16,.07);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(53,166,111,.10),
            transparent 25rem
        ),
        linear-gradient(
            180deg,
            #f9faf8 0%,
            var(--msg-cream) 55%,
            #fff 100%
        );
    color: var(--msg-ink);
    font-family: Inter, Arial, Helvetica, sans-serif;
}

/* HEADER */

body > header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 76px;
    padding: 0 clamp(20px, 5vw, 72px);
    background: rgba(249,250,248,.90);
    border-bottom: 1px solid rgba(220,228,223,.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.logo {
    color: var(--msg-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .18em;
}

body > header nav {
    display: flex;
    align-items: center;
    gap: 26px;
}

body > header nav a {
    margin: 0;
    color: var(--msg-muted);
    font-size: .75rem;
    font-weight: 650;
    text-decoration: none;
    transition: color 160ms ease;
}

body > header nav a:hover {
    color: var(--msg-green);
}

/* MAIN */

main {
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 68px 0 110px;
}

/* HERO */

.hero {
    max-width: 820px;
}

.hero::before {
    content: "PRIVATE CONNECTIONS";
    display: block;
    margin-bottom: 16px;
    color: var(--msg-green);
    font-size: .66rem;
    font-weight: 800;
    letter-spacing: .17em;
}

.hero h1 {
    margin: 0 0 17px;
    color: var(--msg-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(3rem, 7vw, 5.5rem);
    line-height: .98;
    letter-spacing: -.05em;
    font-weight: 500;
}

.hero p {
    max-width: 690px;
    margin: 0;
    color: var(--msg-muted);
    font-size: .96rem;
    line-height: 1.85;
}

/* MESSAGE APPLICATION */

.messages-layout {
    position: relative;
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    height: min(700px, calc(100vh - 270px));
    min-height: 590px;
    margin-top: 50px;
    overflow: hidden;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--msg-line);
    border-radius: 5px;
    box-shadow: var(--msg-shadow);
}

/* CONVERSATION PANEL */

.conversations {
    min-width: 0;
    overflow: hidden;
    background: #fbfcfb;
    border-right: 1px solid var(--msg-line);
}

.panel-title {
    display: flex;
    align-items: center;
    min-height: 74px;
    padding: 0 24px;
    color: var(--msg-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    font-weight: 500;
    border-bottom: 1px solid var(--msg-line-soft);
}

#conversationList {
    height: calc(100% - 74px);
    overflow-y: auto;
}

#conversationList::-webkit-scrollbar,
#chatMessages::-webkit-scrollbar {
    width: 6px;
}

#conversationList::-webkit-scrollbar-thumb,
#chatMessages::-webkit-scrollbar-thumb {
    background: #d5ded8;
    border-radius: 99px;
}

/* CONVERSATION ROWS */

.conversation {
    position: relative;
    display: block;
    min-height: 78px;
    padding: 17px 22px 16px 70px;
    border-bottom: 1px solid var(--msg-line-soft);
    cursor: pointer;
    transition:
        background 150ms ease,
        border-color 150ms ease;
}

.conversation::before {
    content: "";
    position: absolute;
    left: 21px;
    top: 18px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background:
        linear-gradient(
            135deg,
            var(--msg-green-pale),
            #d4eadc
        );
    border: 1px solid rgba(22,131,79,.13);
}

.conversation::after {
    content: "";
    position: absolute;
    left: 46px;
    top: 44px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--msg-green);
    border: 2px solid #fbfcfb;
}

.conversation:hover {
    background: #f5f9f6;
}

.conversation.active {
    background: var(--msg-green-pale);
    box-shadow: inset 3px 0 0 var(--msg-green);
}

.conversation.active::after {
    border-color: var(--msg-green-pale);
}

.conversation strong {
    display: block;
    margin: 0 0 5px;
    overflow: hidden;
    color: var(--msg-ink-soft);
    font-size: .82rem;
    font-weight: 750;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.conversation span {
    display: block;
    overflow: hidden;
    color: var(--msg-soft);
    font-size: .71rem;
    line-height: 1.4;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* CHAT */

.chat {
    min-width: 0;
    min-height: 0;
    background:
        radial-gradient(
            circle at 85% 10%,
            rgba(53,166,111,.055),
            transparent 20rem
        ),
        #fff;
}

.chat-header {
    display: flex;
    align-items: center;
    min-height: 74px;
    padding: 0 28px;
    color: var(--msg-ink);
    font-size: .88rem;
    font-weight: 750;
    border-bottom: 1px solid var(--msg-line);
    background: rgba(255,255,255,.90);
}

/* EMPTY */

.chat-empty {
    width: min(430px, 90%);
    margin: auto;
    padding: 35px;
    text-align: center;
}

.chat-empty::before {
    content: "V";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--msg-ink);
    color: #fff;
    font-family: Georgia, serif;
    font-size: 1.5rem;
    box-shadow: 0 12px 35px rgba(11,21,16,.12);
}

.chat-empty h2 {
    margin: 0 0 10px;
    color: var(--msg-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.65rem;
    font-weight: 500;
}

.chat-empty p {
    margin: 0;
    color: var(--msg-muted);
    font-size: .82rem;
    line-height: 1.75;
}

/* MESSAGES */

.chat-messages {
    min-height: 0;
    padding: 30px clamp(20px, 4vw, 48px);
    background:
        linear-gradient(
            180deg,
            rgba(246,248,245,.55),
            rgba(255,255,255,.95)
        );
}

.message {
    width: fit-content;
    max-width: min(70%, 560px);
    margin-bottom: 12px;
    padding: 12px 16px;
    border-radius: 17px;
    font-size: .82rem;
    line-height: 1.6;
    box-shadow: 0 3px 12px rgba(11,21,16,.035);
}

.message.mine {
    margin-left: auto;
    background: var(--msg-green);
    color: #fff;
    border: 1px solid var(--msg-green);
    border-bottom-right-radius: 5px;
}

.message.theirs {
    margin-right: auto;
    background: #f0f3f0;
    color: var(--msg-ink-soft);
    border: 1px solid #e2e8e3;
    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;
    margin-top: 5px;
    font-size: .58rem;
    opacity: .62;
}

/* COMPOSER */

.message-form {
    align-items: flex-end;
    padding: 16px 18px;
    background: #fff;
    border-top: 1px solid var(--msg-line);
}

.message-form textarea {
    min-height: 48px;
    max-height: 130px;
    padding: 13px 16px;
    color: var(--msg-ink);
    background: #f8faf8;
    border: 1px solid #d5dfd8;
    border-radius: 15px;
    outline: none;
    font: inherit;
    font-size: .82rem;
    transition:
        border-color 160ms ease,
        box-shadow 160ms ease;
}

.message-form textarea:focus {
    border-color: var(--msg-green);
    box-shadow: 0 0 0 4px rgba(22,131,79,.08);
}

.message-form textarea::placeholder {
    color: #a0aaa4;
}

.message-form button {
    min-height: 48px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--msg-green);
    color: #fff;
    font-size: .75rem;
    font-weight: 750;
    transition: all 160ms ease;
}

.message-form button:hover {
    background: var(--msg-green-dark);
    transform: translateY(-1px);
}

/* STATUS */

.status {
    padding: 25px 22px;
    color: var(--msg-soft);
    font-size: .76rem;
    line-height: 1.6;
}

.error {
    color: #a13c3c;
}

/* GLOBAL MOBILE NAV SPACE */

@media (max-width: 760px) {

    body > header {
        min-height: 68px;
        padding: 0 18px;
    }

    body > header nav {
        display: none;
    }

    main {
        width: min(100% - 28px, 1320px);
        padding: 42px 0 105px;
    }

    .hero h1 {
        font-size: clamp(2.8rem, 14vw, 4rem);
    }

    .messages-layout {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 0;
        margin-top: 34px;
        border-radius: 4px;
    }

    .conversations {
        max-height: 310px;
        border-right: 0;
        border-bottom: 1px solid var(--msg-line);
    }

    #conversationList {
        height: auto;
        max-height: 236px;
    }

    .chat {
        min-height: 560px;
    }

    .chat-header {
        min-height: 64px;
        padding: 0 20px;
    }

    .chat-messages {
        padding: 22px 16px;
    }

    .message {
        max-width: 84%;
    }

    .message-form {
        padding: 12px;
    }

    .message-form button {
        padding: 0 17px;
    }
}

@media (max-width: 430px) {

    .hero p {
        font-size: .88rem;
    }

    .messages-layout {
        width: calc(100% + 2px);
        margin-left: -1px;
    }

    .panel-title {
        min-height: 64px;
        padding: 0 18px;
    }

    .conversation {
        padding-left: 64px;
    }

    .conversation::before {
        left: 17px;
    }

    .conversation::after {
        left: 42px;
    }

    .message-form {
        gap: 7px;
    }

    .message-form textarea {
        min-width: 0;
    }

    .message-form button {
        font-size: 0;
        width: 48px;
        padding: 0;
    }

    .message-form button::after {
        content: "➤";
        font-size: 1rem;
    }
}

</style>

</head>

<body>

<header>
    <div class="logo">VELMORA</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="people.html">People</a>
        <a href="skills-passport.html">Skills</a>
        <a href="account.html">Account</a>
    </nav>
</header>

<main>

<section class="hero">
    <h1>Messages.</h1>
    <p>
        Connect with people you know through VELMORA.
        Conversations open after a connection is accepted.
    </p>
</section>

<section class="messages-layout">

    <aside class="conversations">
        <div class="panel-title">Your conversations</div>
        <div id="conversationList">
            <div class="status">Loading conversations...</div>
        </div>
    </aside>

    <section class="chat">

        <div id="chatHeader" class="chat-header" style="display:none;"></div>

        <div id="chatEmpty" class="chat-empty">
            <h2>Your messages will appear here.</h2>
            <p>
                Connect with someone from People, then start a conversation.
            </p>
        </div>

        <div id="chatMessages" class="chat-messages" style="display:none;"></div>

        <form id="messageForm" class="message-form" style="display:none;">
            <textarea
                id="messageInput"
                maxlength="5000"
                placeholder="Write a message..."
                required
            ></textarea>
            <button type="submit">Send</button>
        </form>

    </section>

</section>

</main>

<script>
const API = "http://127.0.0.1:5000";
const token = localStorage.getItem("velmora_token");
const user = JSON.parse(localStorage.getItem("velmora_user") || "null");

if (!token || !user) {
    window.location.href = "login.html";
}

const conversationList =
    document.getElementById("conversationList");

const chatHeader =
    document.getElementById("chatHeader");

const chatEmpty =
    document.getElementById("chatEmpty");

const chatMessages =
    document.getElementById("chatMessages");

const messageForm =
    document.getElementById("messageForm");

const messageInput =
    document.getElementById("messageInput");

let conversations = [];
let activeConversation = null;

const requestedUserId =
    new URLSearchParams(window.location.search).get("userId");

let directUser = null;

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function formatDate(value) {
    if (!value) return "";
    return new Date(value).toLocaleString();
}

async function loadConversations() {
    try {
        const response = await fetch(
            `${API}/api/conversations`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (response.status === 401) {
            localStorage.removeItem("velmora_token");
            localStorage.removeItem("velmora_user");
            window.location.href = "login.html";
            return;
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        conversations = data.conversations || [];

        if (!conversations.length) {
            conversationList.innerHTML = `
                <div class="status">
                    No conversations yet.
                </div>
            `;
            return;
        }

        conversationList.innerHTML =
            conversations.map(conversation => `
                <div
                    class="conversation"
                    data-id="${conversation.id}"
                >
                    <strong>
                        ${escapeHtml(conversation.other_user_name)}
                    </strong>

                    <span>
                        ${escapeHtml(
                            conversation.last_message || "No messages"
                        )}
                    </span>
                </div>
            `).join("");

        document
            .querySelectorAll(".conversation")
            .forEach(item => {
                item.addEventListener("click", () => {
                    openConversation(
                        Number(item.dataset.id)
                    );
                });
            });

    } catch (error) {
        conversationList.innerHTML = `
            <div class="status error">
                Unable to load messages.
            </div>
        `;
    }
}

async function prepareDirectMessage() {
    if (!requestedUserId) return;

    if (Number(requestedUserId) === Number(user.id)) {
        return;
    }

    try {
        const response = await fetch(
            `${API}/api/profile/${encodeURIComponent(requestedUserId)}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (!response.ok) return;

        const data = await response.json();

        if (!data.success || !data.profile) return;

        directUser = data.profile;

        const existingConversation =
            conversations.find(
                conversation =>
                    Number(conversation.other_user_id) ===
                    Number(requestedUserId)
            );

        if (existingConversation) {
            await openConversation(
                Number(existingConversation.id)
            );
            return;
        }

        chatEmpty.style.display = "none";
        chatHeader.style.display = "block";
        chatMessages.style.display = "block";
        messageForm.style.display = "flex";

        chatHeader.textContent =
            directUser.full_name || "VELMORA Member";

        chatMessages.innerHTML = `
            <div class="chat-empty">
                <h2>Start a conversation.</h2>
                <p>
                    You are connected with
                    ${escapeHtml(directUser.full_name || "this person")}.
                    Send your first message below.
                </p>
            </div>
        `;

    } catch (error) {
        console.error(
            "Direct message preparation error:",
            error
        );
    }
}

async function openConversation(conversationId) {

    activeConversation =
        conversations.find(
            item => Number(item.id) === conversationId
        );

    if (!activeConversation) return;

    document
        .querySelectorAll(".conversation")
        .forEach(item => {
            item.classList.toggle(
                "active",
                Number(item.dataset.id) === conversationId
            );
        });

    chatEmpty.style.display = "none";
    chatHeader.style.display = "block";
    chatMessages.style.display = "block";
    messageForm.style.display = "flex";

    chatHeader.textContent =
        activeConversation.other_user_name;

    chatMessages.innerHTML =
        `<div class="status">Loading messages...</div>`;

    try {
        const response = await fetch(
            `${API}/api/conversations/${conversationId}/messages`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (response.status === 401) {
            window.location.href = "login.html";
            return;
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        const messages = data.messages || [];

        if (!messages.length) {
            chatMessages.innerHTML =
                `<div class="status">No messages yet.</div>`;
            return;
        }

        chatMessages.innerHTML =
            messages.map(message => {

                const mine =
                    Number(message.sender_id) === Number(user.id);

                return `
                    <div class="message ${mine ? "mine" : "theirs"}">
                        ${escapeHtml(message.message_text)}

                        <span class="message-time">
                            ${formatDate(message.created_at)}
                        </span>
                    </div>
                `;
            }).join("");

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    } catch (error) {
        chatMessages.innerHTML = `
            <div class="status error">
                Unable to load this conversation.
            </div>
        `;
    }
}

messageForm.addEventListener("submit", async event => {

    event.preventDefault();

    if (!activeConversation) return;

    const text =
        messageInput.value.trim();

    if (!text) return;

    const recipientId =
        activeConversation.other_user_id;

    try {

        const response = await fetch(
            `${API}/api/messages/${recipientId}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                    messageText: text
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to send message."
            );
        }

        messageInput.value = "";

        await loadConversations();

        await openConversation(
            Number(data.message.conversation_id)
        );

    } catch (error) {
        alert(error.message);
    }
});

async function openUserFromUrl() {
    const params =
        new URLSearchParams(window.location.search);

    const userId =
        params.get("userId");

    if (!userId) return;

    if (Number(userId) === Number(user.id)) {
        return;
    }

    try {
        const response = await fetch(
            `${API}/api/profile/${encodeURIComponent(userId)}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            console.error(
                "Unable to load requested profile."
            );
            return;
        }

        const data = await response.json();

        if (!data.success || !data.profile) {
            return;
        }

        const profile = data.profile;

        const existing =
            conversations.find(
                item =>
                    Number(item.other_user_id) ===
                    Number(profile.id)
            );

        if (existing) {
            await openConversation(
                Number(existing.id)
            );
            return;
        }

        const connectionResponse = await fetch(
            `${API}/api/connections`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        let connected = false;

        if (connectionResponse.ok) {
            const connectionData =
                await connectionResponse.json();

            connected =
                (connectionData.connections || []).some(
                    connection =>
                        Number(connection.user_id) ===
                        Number(profile.id)
                );
        }

        chatEmpty.style.display = "none";
        chatHeader.style.display = "block";
        chatMessages.style.display = "block";

        chatHeader.textContent =
            profile.full_name || "VELMORA Member";

        if (connected) {
            messageForm.style.display = "flex";

            chatMessages.innerHTML = `
                <div class="status">
                    Start a conversation with
                    <strong>
                        ${escapeHtml(
                            profile.full_name ||
                            "this person"
                        )}
                    </strong>.
                </div>
            `;

            activeConversation = {
                other_user_id: profile.id,
                other_user_name: profile.full_name
            };

        } else {
            messageForm.style.display = "none";

            chatMessages.innerHTML = `
                <div class="status">
                    <strong>
                        ${escapeHtml(
                            profile.full_name ||
                            "VELMORA Member"
                        )}
                    </strong>
                    <br><br>
                    You can message this person after
                    your connection is accepted.
                </div>
            `;

            activeConversation = null;
        }

    } catch (error) {
        console.error(
            "Direct message loading error:",
            error
        );
    }
}
loadConversations().then(openUserFromUrl);
</script>
