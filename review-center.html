<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Review Center — VELMORA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #17201d;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e3e8e5;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: #087443;
            letter-spacing: 0.5px;
        }

        .back {
            color: #087443;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        main {
            width: min(100% - 32px, 900px);
            margin: 30px auto;
        }

        .eyebrow {
            color: #087443;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .intro {
            color: #66716c;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .status {
            display: none;
            background: #ffffff;
            border: 1px solid #dce5e0;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .status.show {
            display: block;
        }

        .submission {
            background: #ffffff;
            border: 1px solid #e1e7e4;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .student-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .student-email {
            color: #68736e;
            font-size: 13px;
        }

        .pending {
            background: #fff6df;
            color: #946500;
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .mission {
            color: #087443;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .answer {
            background: #f7f9f8;
            border-radius: 12px;
            padding: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }

        .date {
            color: #7b8581;
            font-size: 12px;
        }

        .feedback-label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 800;
        }

        .feedback {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            border: 1px solid #dce5e0;
            border-radius: 12px;
            padding: 13px;
            font: inherit;
            line-height: 1.5;
            outline: none;
        }

        .feedback:focus {
            border-color: #087443;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .action-button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .approve {
            background: #087443;
            color: #ffffff;
        }

        .revision {
            background: #fff1df;
            color: #8a5700;
        }

        .action-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .empty {
            background: #ffffff;
            border: 1px solid #e1e7e4;
            border-radius: 18px;
            padding: 35px 20px;
            text-align: center;
            color: #68736e;
        }

        @media (max-width: 600px) {
            main {
                width: min(100% - 24px, 900px);
                margin: 22px auto;
            }

            h1 {
                font-size: 26px;
            }

            .submission-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">VELMORA</div>

    <a
        href="dashboard.html"
        class="back"
    >
        Back to Dashboard
    </a>
</header>

<main>

    <div class="eyebrow">
        Reviewer workspace
    </div>

    <h1>
        Review Center
    </h1>

    <p class="intro">
        Review learner practice submissions and help them move
        from practice toward verified proof.
    </p>

    <div
        id="status"
        class="status"
    ></div>

    <div id="submissions"></div>

</main>

<script>
const token =
    localStorage.getItem("velmora_token");

const status =
    document.getElementById("status");

const submissionsContainer =
    document.getElementById("submissions");

if (!token) {
    window.location.replace("login.html");
}

function showStatus(message) {
    status.textContent = message;
    status.classList.add("show");
}

async function loadSubmissions() {

    try {

        const response =
            await fetch(
                "http://127.0.0.1:5000/api/reviewer/submissions",
                {
                    method: "GET",
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        if (response.status === 401) {

            localStorage.removeItem(
                "velmora_token"
            );

            localStorage.removeItem(
                "velmora_user"
            );

            window.location.replace(
                "login.html"
            );

            return;
        }

        if (response.status === 403) {
            showStatus(
                "Reviewer access is required to open this page."
            );
            return;
        }

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.message ||
                "Unable to load submissions."
            );
        }

        const submissions =
            Array.isArray(data.submissions)
                ? data.submissions
                : [];

        if (submissions.length === 0) {

            submissionsContainer.innerHTML = `
                <div class="empty">
                    No pending submissions right now.
                </div>
            `;

            return;
        }

        submissionsContainer.innerHTML =
            submissions.map(
                submission => `
                    <article class="submission">

                        <div class="submission-header">

                            <div>
                                <div class="student-name">
                                    ${escapeHtml(
                                        submission.full_name
                                    )}
                                </div>

                                <div class="student-email">
                                    ${escapeHtml(
                                        submission.email || ""
                                    )}
                                </div>
                            </div>

                            <div class="pending">
                                Pending Review
                            </div>

                        </div>

                        <div class="mission">
                            ${escapeHtml(
                                submission.mission_key
                            )}
                        </div>

                        <div class="answer">
                            ${escapeHtml(
                                submission.submission_text
                            )}
                        </div>

                        <div class="date">
                            Submitted:
                            ${formatDate(
                                submission.submitted_at
                            )}
                        </div>

                        <label
                            class="feedback-label"
                            for="feedback-${submission.id}"
                        >
                            Feedback
                        </label>

                        <textarea
                            id="feedback-${submission.id}"
                            class="feedback"
                            placeholder="Write clear feedback for the learner..."
                        ></textarea>

                        <div class="actions">

                            <button
                                type="button"
                                class="action-button approve"
                                data-id="${submission.id}"
                                data-decision="approved"
                            >
                                Approve
                            </button>

                            <button
                                type="button"
                                class="action-button revision"
                                data-id="${submission.id}"
                                data-decision="rejected"
                            >
                                Needs Revision
                            </button>

                        </div>

                    </article>
                `
            ).join("");

        document
            .querySelectorAll(".action-button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {
                        reviewSubmission(
                            Number(this.dataset.id),
                            this.dataset.decision,
                            this
                        );
                    }
                );

            });

    } catch (error) {

        console.error(
            "Review Center error:",
            error
        );

        showStatus(
            "Unable to load reviewer submissions right now."
        );
    }
}


async function reviewSubmission(
    submissionId,
    decision,
    clickedButton
) {

    const feedbackElement =
        document.getElementById(
            `feedback-${submissionId}`
        );

    const feedback =
        feedbackElement
            ? feedbackElement.value.trim()
            : "";

    if (!feedback) {
        showStatus(
            "Please add feedback before completing the review."
        );
        return;
    }

    const card =
        clickedButton.closest(
            ".submission"
        );

    const buttons =
        card.querySelectorAll(
            ".action-button"
        );

    buttons.forEach(button => {
        button.disabled = true;
    });

    clickedButton.textContent =
        decision === "approved"
            ? "Approving..."
            : "Sending Back...";

    try {

        const response =
            await fetch(
                `http://127.0.0.1:5000/api/reviewer/submissions/${submissionId}/review`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        decision,
                        feedback
                    })
                }
            );

        const data =
            await response.json();

        if (response.status === 401) {

            localStorage.removeItem(
                "velmora_token"
            );

            localStorage.removeItem(
                "velmora_user"
            );

            window.location.replace(
                "login.html"
            );

            return;
        }

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.message ||
                "Unable to complete the review."
            );
        }

        showStatus(
            decision === "approved"
                ? "Submission approved and verified proof created."
                : "Submission marked as needing revision."
        );

        card.remove();

        if (
            submissionsContainer.children.length === 0
        ) {
            submissionsContainer.innerHTML = `
                <div class="empty">
                    No pending submissions right now.
                </div>
            `;
        }

    } catch (error) {

        console.error(
            "Review action error:",
            error
        );

        showStatus(
            error.message ||
            "Unable to complete the review."
        );

        buttons.forEach(button => {
            button.disabled = false;
        });

        clickedButton.textContent =
            decision === "approved"
                ? "Approve"
                : "Needs Revision";
    }
}

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {

    if (!value) {
        return "Unknown";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(value);
    }

    return date.toLocaleString();
}

loadSubmissions();
</script>

</body>
</html>
