<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opportunities — VELMORA</title>

    <link rel="stylesheet" href="style.css">

    <style>
/* =========================================================
   VELMORA GENESIS — OPPORTUNITIES
   Visual layer only. Existing HTML/JS functionality preserved.
   ========================================================= */

.opportunities-page {
    width: min(1320px, calc(100% - 48px));
    margin: 0 auto;
    padding: 76px 0 120px;
}

.opportunities-header {
    position: relative;
    padding: 18px 0 58px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--line, #dce4df);
}

.opportunities-header::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -1px;
    width: 180px;
    height: 2px;
    background: var(--green, #16834f);
}

.opportunities-header .eyebrow {
    margin-bottom: 18px;
    color: var(--green, #16834f);
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}

.opportunities-header h1 {
    max-width: 900px;
    margin: 0;
    color: var(--ink, #0b1510);
    font-family: var(--serif, Georgia, serif);
    font-size: clamp(3rem, 7vw, 6.6rem);
    font-weight: 500;
    letter-spacing: -.055em;
    line-height: .94;
}

.opportunities-header p {
    max-width: 760px;
    margin: 25px 0 0;
    color: var(--muted, #66736c);
    font-size: 1.04rem;
    line-height: 1.8;
}

.opportunities-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.opportunities-actions .button {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--line, #dce4df);
    background: var(--white, #fff);
    color: var(--ink, #0b1510);
    text-decoration: none;
    font-weight: 750;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
}

.opportunities-actions .button:hover {
    transform: translateY(-2px);
    border-color: var(--green, #16834f);
}

.opportunities-actions .button:last-child {
    background: var(--green, #16834f);
    border-color: var(--green, #16834f);
    color: #fff;
}

.opportunity-tools {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 12px;
    margin-bottom: 16px;
}

.opportunity-search,
.opportunity-filter {
    width: 100%;
    min-height: 54px;
    box-sizing: border-box;
    border: 1px solid var(--line, #dce4df);
    background: var(--white, #fff);
    color: var(--ink, #0b1510);
    border-radius: 999px;
    padding: 0 20px;
    outline: none;
    font: inherit;
}

.opportunity-search::placeholder {
    color: var(--soft-muted, #98a39d);
}

.opportunity-search:focus,
.opportunity-filter:focus {
    border-color: var(--green, #16834f);
    box-shadow: 0 0 0 3px rgba(22,131,79,.08);
}

.opportunity-filter {
    cursor: pointer;
}

.opportunity-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 32px;
}

.opportunity-filter-button {
    border: 1px solid var(--line, #dce4df);
    background: var(--cream, #f6f8f5);
    color: var(--muted, #66736c);
    border-radius: 999px;
    padding: 9px 15px;
    cursor: pointer;
    font: inherit;
    font-size: .82rem;
    font-weight: 750;
    transition: all .18s ease;
}

.opportunity-filter-button:hover {
    border-color: var(--green, #16834f);
    color: var(--green-dark, #0c6039);
}

.opportunity-filter-button.active {
    border-color: var(--green, #16834f);
    background: var(--green, #16834f);
    color: #fff;
}

.opportunities-list {
    display: grid;
    gap: 16px;
}

.opportunity-card {
    position: relative;
    overflow: hidden;
    padding: 30px;
    border: 1px solid var(--line, #dce4df);
    border-radius: 3px;
    background: var(--white, #fff);
    box-shadow: 0 12px 35px rgba(20,45,32,.045);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}

.opportunity-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--green, #16834f);
    opacity: .75;
}

.opportunity-card:hover {
    transform: translateY(-3px);
    border-color: rgba(22,131,79,.32);
    box-shadow: 0 18px 45px rgba(20,45,32,.08);
}

.opportunity-card .card-label {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--green-pale, #eaf4ee);
    color: var(--green-dark, #0c6039);
    font-size: .68rem;
    font-weight: 850;
    letter-spacing: .09em;
    text-transform: uppercase;
}

.opportunity-card h2 {
    max-width: 850px;
    margin: 15px 0 10px;
    color: var(--ink, #0b1510);
    font-family: var(--serif, Georgia, serif);
    font-size: clamp(1.65rem, 3vw, 2.35rem);
    font-weight: 500;
    letter-spacing: -.025em;
    line-height: 1.08;
}

.opportunity-description {
    max-width: 880px;
    margin: 0;
    color: var(--muted, #66736c);
    line-height: 1.75;
}

.opportunity-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 20px 0 0;
}

.opportunity-tag {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line, #dce4df);
    border-radius: 999px;
    background: var(--cream, #f6f8f5);
    color: var(--ink-soft, #15231b);
    font-size: .76rem;
    font-weight: 700;
}

.opportunity-skills {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 17px;
}

.opportunity-skill {
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--green-pale, #eaf4ee);
    color: var(--green-dark, #0c6039);
    font-size: .72rem;
    font-weight: 750;
}

.opportunity-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--line, #dce4df);
}

.opportunity-owner {
    color: var(--soft-muted, #98a39d);
    font-size: .8rem;
}

.opportunity-owner strong {
    color: var(--ink, #0b1510);
    font-weight: 800;
}

.opportunity-footer .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 17px;
    border-radius: 999px;
    background: var(--ink, #0b1510);
    color: #fff;
    text-decoration: none;
    font-size: .78rem;
    font-weight: 800;
    transition: background .18s ease, transform .18s ease;
}

.opportunity-footer .button:hover {
    background: var(--green, #16834f);
    transform: translateY(-1px);
}

.opportunity-empty,
.opportunity-error,
.opportunity-loading {
    padding: 70px 28px;
    text-align: center;
    border: 1px solid var(--line, #dce4df);
    border-radius: 3px;
    background: var(--white, #fff);
}

.opportunity-empty h2,
.opportunity-error h2,
.opportunity-loading h2 {
    margin: 0 0 10px;
    color: var(--ink, #0b1510);
    font-family: var(--serif, Georgia, serif);
    font-size: 2rem;
    font-weight: 500;
}

.opportunity-empty p,
.opportunity-error p {
    max-width: 540px;
    margin: 0 auto;
    color: var(--muted, #66736c);
    line-height: 1.7;
}

.opportunity-error .button {
    display: inline-flex;
    margin-top: 20px;
    min-height: 42px;
    align-items: center;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--green, #16834f);
    color: #fff;
    text-decoration: none;
    font-weight: 800;
}

@media (max-width: 760px) {
    .opportunities-page {
        width: min(100% - 32px, 1320px);
        padding: 48px 0 100px;
    }

    .opportunities-header {
        padding-bottom: 42px;
    }

    .opportunities-header h1 {
        font-size: clamp(2.8rem, 14vw, 4.5rem);
    }

    .opportunities-header p {
        font-size: .95rem;
    }

    .opportunity-tools {
        grid-template-columns: 1fr;
    }

    .opportunity-card {
        padding: 24px 20px;
    }

    .opportunity-footer {
        align-items: stretch;
    }

    .opportunity-footer .button {
        width: 100%;
    }
}

@media (max-width: 480px) {
    .opportunities-page {
        width: calc(100% - 24px);
    }

    .opportunities-actions {
        display: grid;
        grid-template-columns: 1fr;
    }

    .opportunities-actions .button {
        width: 100%;
    }

    .opportunity-filter-button {
        padding: 8px 12px;
        font-size: .75rem;
    }
}
</style>
</head>

<body>

<main class="opportunities-page">

    <header class="opportunities-header">

        <div class="eyebrow">VELMORA Opportunities</div>

        <h1>Find possibility. Create possibility.</h1>

        <p>
            Discover jobs, freelance projects, tasks, remote roles,
            internships, mentorships and collaborations from people
            and businesses around the world.
        </p>

        <div class="opportunities-actions">
            <a href="dashboard.html" class="button">
                Dashboard
            </a>

            <a href="people.html" class="button">
                People
            </a>

            <a href="messages.html" class="button">
                Messages
            </a>

            <a href="opportunity-create.html" class="button">
                Create Opportunity
            </a>
        </div>

    </header>

    <section>

        <div class="opportunity-tools">

            <input
                id="opportunitySearch"
                class="opportunity-search"
                type="search"
                placeholder="Search opportunities..."
                autocomplete="off"
            >

            <select id="opportunitySort" class="opportunity-filter">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
            </select>

        </div>

        <div class="opportunity-filters" id="opportunityFilters">

            <button class="opportunity-filter-button active" data-type="all">
                All
            </button>

            <button class="opportunity-filter-button" data-type="job">
                Jobs
            </button>

            <button class="opportunity-filter-button" data-type="freelance">
                Freelance
            </button>

            <button class="opportunity-filter-button" data-type="task">
                Tasks
            </button>

            <button class="opportunity-filter-button" data-type="remote_role">
                Remote Roles
            </button>

            <button class="opportunity-filter-button" data-type="internship">
                Internships
            </button>

            <button class="opportunity-filter-button" data-type="apprenticeship">
                Apprenticeships
            </button>

            <button class="opportunity-filter-button" data-type="contract">
                Contracts
            </button>

            <button class="opportunity-filter-button" data-type="mentorship">
                Mentorship
            </button>

            <button class="opportunity-filter-button" data-type="collaboration">
                Collaboration
            </button>

        </div>

        <div id="opportunitiesList" class="opportunities-list">

            <div class="opportunity-loading">
                Loading opportunities...
            </div>

        </div>

    </section>

</main>

<script>
const API_BASE = "http://127.0.0.1:5000";

const searchInput = document.getElementById("opportunitySearch");
const sortSelect = document.getElementById("opportunitySort");
const filters = document.querySelectorAll(".opportunity-filter-button");
const list = document.getElementById("opportunitiesList");

let opportunities = [];
let selectedType = "all";

function getToken() {
    return localStorage.getItem("velmora_token") ||
           localStorage.getItem("token") ||
           localStorage.getItem("accessToken");
}

function formatType(type) {
    const labels = {
        job: "Job",
        freelance: "Freelance",
        task: "One-time Task",
        remote_role: "Remote Role",
        internship: "Internship",
        apprenticeship: "Apprenticeship",
        contract: "Contract",
        mentorship: "Mentorship",
        collaboration: "Collaboration"
    };

    return labels[type] || type;
}

function formatCompensation(opportunity) {
    if (
        opportunity.compensation_min == null &&
        opportunity.compensation_max == null
    ) {
        return "Compensation not specified";
    }

    const currency = opportunity.currency || "USD";
    const min = opportunity.compensation_min;
    const max = opportunity.compensation_max;

    if (min != null && max != null) {
        return `${currency} ${Number(min).toLocaleString()} – ${Number(max).toLocaleString()}`;
    }

    if (min != null) {
        return `From ${currency} ${Number(min).toLocaleString()}`;
    }

    return `Up to ${currency} ${Number(max).toLocaleString()}`;
}

function renderOpportunities() {

    const search = searchInput.value.trim().toLowerCase();

    let filtered = opportunities.filter(opportunity => {

        const matchesType =
            selectedType === "all" ||
            opportunity.opportunity_type === selectedType;

        const haystack = [
            opportunity.title,
            opportunity.description,
            opportunity.location,
            opportunity.owner_name,
            ...(Array.isArray(opportunity.skills)
                ? opportunity.skills
                : [])
        ]
        .join(" ")
        .toLowerCase();

        return matchesType && haystack.includes(search);
    });

    if (sortSelect.value === "oldest") {
        filtered.sort(
            (a, b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
        );
    } else {
        filtered.sort(
            (a, b) =>
                new Date(b.created_at) -
                new Date(a.created_at)
        );
    }

    if (!filtered.length) {
        list.innerHTML = `
            <div class="opportunity-empty">
                <h2>No opportunities found</h2>
                <p>
                    Try another search or create an opportunity
                    for someone else.
                </p>
            </div>
        `;
        return;
    }

    list.innerHTML = filtered.map(opportunity => {

        const skills = Array.isArray(opportunity.skills)
            ? opportunity.skills
            : [];

        return `
            <article class="card opportunity-card">

                <div class="card-label">
                    ${formatType(opportunity.opportunity_type)}
                </div>

                <h2>${escapeHtml(opportunity.title)}</h2>

                <p class="opportunity-description">
                    ${escapeHtml(opportunity.description)}
                </p>

                <div class="opportunity-meta">

                    <span class="opportunity-tag">
                        ${opportunity.is_remote ? "Remote" : "On-site"}
                    </span>

                    <span class="opportunity-tag">
                        ${escapeHtml(opportunity.location || "Global")}
                    </span>

                    <span class="opportunity-tag">
                        ${escapeHtml(formatCompensation(opportunity))}
                    </span>

                </div>

                ${
                    skills.length
                        ? `
                            <div class="opportunity-skills">
                                ${skills.map(skill => `
                                    <span class="opportunity-skill">
                                        ${escapeHtml(skill)}
                                    </span>
                                `).join("")}
                            </div>
                        `
                        : ""
                }

                <div class="opportunity-footer">

                    <div class="opportunity-owner">
                        Posted by
                        <strong>
                            ${escapeHtml(opportunity.owner_name || "VELMORA member")}
                        </strong>
                        ${opportunity.owner_country
                            ? ` · ${escapeHtml(opportunity.owner_country)}`
                            : ""}
                    </div>

                    <a
                        href="opportunity-view.html?id=${encodeURIComponent(opportunity.id)}"
                        class="button profile-button"
                    >
                        View Opportunity
                    </a>

                </div>

            </article>
        `;
    }).join("");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function loadOpportunities() {

    const token = getToken();

    if (!token) {
        list.innerHTML = `
            <div class="opportunity-error">
                <h2>Login required</h2>
                <p>Please log in to view VELMORA opportunities.</p>
                <a href="login.html" class="button">
                    Login
                </a>
            </div>
        `;
        return;
    }

    try {

        const response = await fetch(
            `${API_BASE}/api/opportunities`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load opportunities."
            );
        }

        opportunities = data.opportunities || [];

        renderOpportunities();

    } catch (error) {

        console.error("OPPORTUNITIES ERROR:", error);

        list.innerHTML = `
            <div class="opportunity-error">
                <h2>Unable to load opportunities</h2>
                <p>
                    Please try again.
                </p>
            </div>
        `;
    }
}

filters.forEach(button => {

    button.addEventListener("click", () => {

        filters.forEach(item =>
            item.classList.remove("active")
        );

        button.classList.add("active");

        selectedType = button.dataset.type;

        renderOpportunities();
    });
});

searchInput.addEventListener(
    "input",
    renderOpportunities
);

sortSelect.addEventListener(
    "change",
    renderOpportunities
);

loadOpportunities();
</script>

<script src="global-nav.js"></script>
</body>
</html>
